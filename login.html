<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bright Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #5b8def 0%, #7d58d9 100%);
            color: #1f2432;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-shell {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 32px;
            box-shadow: 0 28px 80px rgba(23, 35, 82, 0.2);
            overflow: hidden;
        }

        .login-header {
            background: linear-gradient(135deg, #4f6ce5 0%, #6f4bd8 100%);
            color: white;
            padding: 36px 30px;
            text-align: center;
        }

        .login-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .login-header p {
            font-size: 1rem;
            opacity: 0.92;
        }

        .login-body {
            padding: 32px 30px 40px;
        }

        .field {
            margin-bottom: 22px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #3b4361;
        }

        .field input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #d8dee9;
            border-radius: 16px;
            background: #f7f9ff;
            font-size: 1rem;
            color: #1f2432;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .field input:focus {
            outline: none;
            border-color: #6f5be5;
            box-shadow: 0 0 0 4px rgba(111, 91, 229, 0.12);
        }

        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        .actions .remember {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #5b637d;
            font-size: 0.95rem;
        }

        .actions a {
            color: #5b8def;
            text-decoration: none;
            font-weight: 600;
        }

        .login-button {
            width: 100%;
            padding: 16px 0;
            border-radius: 18px;
            border: none;
            background: linear-gradient(135deg, #5b8def 0%, #7d58d9 100%);
            color: white;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .login-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 18px 35px rgba(52, 84, 229, 0.22);
        }

        .separator {
            display: flex;
            align-items: center;
            gap: 18px;
            margin: 24px 0;
            color: #8a92b2;
            font-size: 0.95rem;
        }

        .separator::before,
        .separator::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e4e8f5;
        }

        .social-buttons {
            display: grid;
            gap: 14px;
        }

        .social-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid #e4e8f5;
            background: white;
            cursor: pointer;
            font-weight: 600;
            color: #4f5783;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        .social-button:hover {
            background: #f6f8ff;
            border-color: #cdd4f1;
        }

        .note {
            margin-top: 26px;
            text-align: center;
            color: #687094;
            font-size: 0.95rem;
        }

        .note a {
            color: #5b8def;
            text-decoration: none;
            font-weight: 700;
        }

        @media (max-width: 480px) {
            .login-shell {
                border-radius: 24px;
            }

            .login-header {
                padding: 28px 22px;
            }

            .login-body {
                padding: 26px 22px 34px;
            }
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="login-header">
            <h1>Welcome back</h1>
            <p>Sign in to continue to your dashboard.</p>
        </div>

        <div class="login-body">
            <form>
                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <div class="actions">
                    <label class="remember">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#">Forgot password?</a>
                </div>

                <button type="submit" class="login-button">Sign In</button>
            </form>

            <div class="separator">or continue with</div>

            <div class="social-buttons">
                <button class="social-button" type="button">Continue with Google</button>
                <button class="social-button" type="button">Continue with Apple</button>
            </div>

            <p class="note">Don't have an account? <a href="#">Create one now</a></p>
        </div>
    </div>
</body>
</html>
